name: Sandbox

# サンドボックス（sandbox/README.md）を、7474/SRC の srcsharp play で画面なしに通す（本編と、動作確認の 1 つずつ）。
# 動作確認は 7474/SRC の新しい修正を確かめるので、既定は 7474/SRC の master で動かす。毎週も動かし、SRC# の変更で崩れていないかを見る
on:
  pull_request:
    paths:
      - 'sandbox/**'
      - 'scripts/make-sandbox.py'
      - 'scripts/check-sandbox.sh'
      - '.github/workflows/sandbox.yml'
  push:
    branches:
      - main
    paths:
      - 'sandbox/**'
      - 'scripts/make-sandbox.py'
      - 'scripts/check-sandbox.sh'
  schedule:
    - cron: '17 21 * * 1'
  workflow_dispatch:
    inputs:
      src_ref:
        description: 'srcsharp を作る 7474/SRC のブランチ・タグ'
        default: 'master'

jobs:
  play:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Checkout SRC
        uses: actions/checkout@v7
        with:
          repository: 7474/SRC
          ref: ${{ inputs.src_ref || 'master' }}
          path: srcsharp

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build srcsharp
        run: dotnet build srcsharp/SRC.Sharp/SRCSharpTools/SRCSharpTools.csproj -c Release -o out/srcsharp

      - name: Play the sandbox
        env:
          SRCSHARP: dotnet ${{ github.workspace }}/out/srcsharp/srcsharp.dll
          BASIC_DATA: ${{ github.workspace }}/srcsharp/SRC.Sharp/Content/basic-data
        run: bash scripts/check-sandbox.sh
