name: Deploy

# SRC#Web（7474/SRC の SRC.Sharp/SRCSharpWeb）を、ポータルの Worker と合わせて Cloudflare に配信する（docs/operations.md の「配信」）
#   SRC#Web・lint・データビューアは、既定（SRC_REF=dev）では 7474/SRC の開発版のリリース（dev。master にマージされるたびに入れ替わる）の zip を使う。
#   SRC_REF にブランチ・タグを渡したときは、その 7474/SRC をここで発行する
#   main への push → 本番（src.koudenpa.net）
#   PR → 本番の Worker のバージョン URL（pr-<番号>-src-site.koudenpa.workers.dev）。本番には出さない
#   手動実行 → 本番か、バージョン URL（staging-src-site.koudenpa.workers.dev）
# バージョン URL のデータ（D1・R2・Queue）は本番と同じ。D1 のマイグレーションは本番に配信するときだけ当てる
# 必要な Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID（任意: MACKEREL_CLIENT_TOKEN）

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: '配信先'
        type: choice
        options:
          - preview
          - production
        default: preview
      src_ref:
        description: '使う 7474/SRC（dev は開発版のリリース。ブランチ・タグならここで発行する）'
        type: string
        default: ''

env:
  SRC_REF: ${{ inputs.src_ref || vars.SRC_REF || 'dev' }}
  # production か、バージョン URL の別名
  TARGET: ${{ (github.event_name == 'push' && 'production') || (github.event_name == 'pull_request' && format('pr-{0}', github.event.number)) || (inputs.target == 'production' && 'production') || 'staging' }}

concurrency:
  group: deploy-${{ (github.event_name == 'push' && 'production') || (github.event_name == 'pull_request' && format('pr-{0}', github.event.number)) || inputs.target }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cloudflare の Secrets が無ければ（準備前・フォークからの PR）配信しない。失敗にはしない
  check:
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN・CLOUDFLARE_ACCOUNT_ID が無いので配信しない（docs/operations.md）"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      # 7474/SRC の開発版（https://github.com/7474/SRC/releases/tag/dev）の zip を取る。
      # manifest.json の SHA-256 と合わなければ（7474/SRC が入れ替えている最中）、少し待って取り直す
      - name: Download SRC#Web (dev)
        id: dev
        if: env.SRC_REF == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            rm -rf dev && mkdir dev
            gh release download dev -R 7474/SRC -D dev -p manifest.json -p SRCSharpWeb.zip -p SRCLintWeb.zip -p SRCDataViewer.zip
            if (cd dev && jq -r '.files[] | select(.name | IN("SRCSharpWeb.zip","SRCLintWeb.zip","SRCDataViewer.zip")) | "\(.sha256)  \(.name)"' manifest.json | sha256sum -c -); then
              break
            fi
            [ "$attempt" = 3 ] && { echo "::error::開発版の zip が manifest.json と合わない"; exit 1; }
            sleep 60
          done
          for p in web:SRCSharpWeb lint:SRCLintWeb viewer:SRCDataViewer; do
            mkdir -p "out/${p%%:*}/wwwroot" && unzip -q "dev/${p#*:}.zip" -d "out/${p%%:*}/wwwroot"
          done
          commit=$(jq -r .commit dev/manifest.json)
          echo "version=dev $(jq -r .app dev/manifest.json) ${commit:0:7}" >> "$GITHUB_OUTPUT"
          echo "::notice::7474/SRC の開発版 $(jq -r .app dev/manifest.json)（${commit}）を使う"

      - name: Checkout SRC
        if: env.SRC_REF != 'dev'
        uses: actions/checkout@v7
        with:
          repository: 7474/SRC
          ref: ${{ env.SRC_REF }}
          path: srcsharp

      - name: Resolve SRC commit
        id: src
        if: env.SRC_REF != 'dev'
        run: |
          echo "sha=$(git -C srcsharp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${SRC_REF} $(git -C srcsharp rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # 発行物は 7474/SRC のコミットごとにキャッシュする（src-host と同じ）
      # https://github.com/actions/cache
      - name: Cache published SRC#Web
        id: published
        if: env.SRC_REF != 'dev'
        uses: actions/cache@v6
        with:
          path: |
            out/web
            out/lint
            out/viewer
          key: srcweb-aot-lint-viewer-${{ steps.src.outputs.sha }}

      - uses: actions/setup-dotnet@v6
        if: env.SRC_REF != 'dev' && steps.published.outputs.cache-hit != 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages and build intermediates
        if: env.SRC_REF != 'dev' && steps.published.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            srcsharp/SRC.Sharp/*/obj
          key: srcweb-build-${{ steps.src.outputs.sha }}
          restore-keys: |
            srcweb-build-

      - name: Publish SRC#Web
        if: env.SRC_REF != 'dev' && steps.published.outputs.cache-hit != 'true'
        run: |
          # マニフェストは SDK に同梱のものを使う（更新すると、NuGet にまだ無いマニフェストを参照するワークロードのセットで失敗することがある）
          # https://learn.microsoft.com/dotnet/core/tools/dotnet-workload-install
          dotnet workload install wasm-tools --skip-manifest-update
          dotnet publish srcsharp/SRC.Sharp/SRCSharpWeb/SRCSharpWeb.csproj -c Release -p:RunAOTCompilation=true -o out/web
          # ブラウザで動く lint（7474/SRC の SRCLintWeb。古い版には無い）
          if [ -f srcsharp/SRC.Sharp/SRCLintWeb/SRCLintWeb.csproj ]; then
            dotnet publish srcsharp/SRC.Sharp/SRCLintWeb/SRCLintWeb.csproj -c Release -o out/lint
          fi
          # データビューア（7474/SRC の SRCDataViewer。srcv.7474.jp と同じもの）。古い版では SRCTestBlazor という名前だった
          viewer=srcsharp/SRC.Sharp/SRCDataViewer/SRCDataViewer.csproj
          [ -f "$viewer" ] || viewer=srcsharp/SRC.Sharp/SRCTestBlazor/SRCTestBlazor.csproj
          dotnet publish "$viewer" -c Release -o out/viewer

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # assemble.sh が esbuild（devDependencies）でアップロードの前の検査を束ねるので、先に入れる
      - run: npm ci

      - name: Assemble
        env:
          MACKEREL_CLIENT_TOKEN: ${{ secrets.MACKEREL_CLIENT_TOKEN }}
        run: |
          if [ -d out/lint/wwwroot ]; then export SRCLINT_DIR=out/lint/wwwroot; fi
          if [ -d out/viewer/wwwroot ]; then export SRCVIEWER_DIR=out/viewer/wwwroot; fi
          SRCWEB_DIR=out/web/wwwroot SRC_VERSION="${{ steps.dev.outputs.version || steps.src.outputs.version }}" bash scripts/assemble.sh

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 静的アセットは 1 ファイル 25 MiB まで。超えるもの（AOT の dotnet.native.wasm など）は R2 の web/ に置き、Worker が返す
          # ファイル名に内容のハッシュが入るので、バージョン URL の版と本番の版が同じバケットに並んでも衝突しない
          # https://developers.cloudflare.com/workers/platform/limits/#static-assets
          (cd dist/play && find . -type f -size +25M | sed 's#^\./##') | while read -r f; do
            echo "R2: web/$f"
            npx wrangler r2 object put "src-site/web/$f" --file "dist/play/$f" --remote
            rm "dist/play/$f"
          done
          if [ "$TARGET" = production ]; then
            npx wrangler d1 migrations apply DB --env production --remote
            npx wrangler deploy --env production
          else
            # https://developers.cloudflare.com/workers/versions-and-deployments/version-urls/
            npx wrangler versions upload --env production --preview-alias "$TARGET" --message "${GITHUB_SHA::7} $TARGET"
            echo "::notice::https://$TARGET-src-site.koudenpa.workers.dev"
          fi
